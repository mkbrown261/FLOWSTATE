<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a12"/>
      <stop offset="100%" style="stop-color:#1a0533"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(168,85,247,0.05)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(168,85,247,0.05)" stroke-width="1"/>
  <!-- Glow circles -->
  <circle cx="600" cy="315" r="300" fill="rgba(168,85,247,0.04)"/>
  <circle cx="600" cy="315" r="200" fill="rgba(168,85,247,0.04)"/>
  <!-- Logo mark -->
  <text x="600" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-size="72" fill="url(#grad)">⚡</text>
  <!-- App name -->
  <text x="600" y="280" text-anchor="middle" font-family="system-ui,-apple-system,sans-serif" font-size="56" font-weight="900" fill="url(#grad)">FLOWSTATE</text>
  <!-- Tagline -->
  <text x="600" y="340" text-anchor="middle" font-family="system-ui,sans-serif" font-size="28" fill="#9ca3af">Build in Flow. Ship with AI.</text>
  <!-- Feature pills -->
  <rect x="220" y="380" width="160" height="38" rx="19" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
  <text x="300" y="404" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#c084fc">⏱ Focus Timer</text>
  <rect x="400" y="380" width="160" height="38" rx="19" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
  <text x="480" y="404" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#c084fc">🤖 AI Chat</text>
  <rect x="580" y="380" width="160" height="38" rx="19" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
  <text x="660" y="404" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#c084fc">🎵 AI Music</text>
  <rect x="760" y="380" width="160" height="38" rx="19" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
  <text x="840" y="404" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#c084fc">📊 FlowScore</text>
  <!-- CTA -->
  <rect x="440" y="450" width="320" height="52" rx="12" fill="url(#grad)"/>
  <text x="600" y="482" text-anchor="middle" font-family="system-ui,sans-serif" font-size="20" font-weight="700" fill="white">flowst8.cc — Free to start</text>
  <!-- PH badge -->
  <rect x="460" y="540" width="280" height="40" rx="8" fill="rgba(255,97,84,0.15)" stroke="rgba(255,97,84,0.4)" stroke-width="1"/>
  <text x="600" y="565" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" fill="#ff6154">🐱 Launching on Product Hunt Today</text>
</svg>
